    <p><code>for(statement1 ; statement2 ; satement3) {...}</code></p>
    <ul>
        <li><b>statement1</b> - runs once before the loop starts &nbsp;(<code>1 = 0</code>)</li>
        <li><b>statement2</b> - the condition checked before every pass &nbsp;(<code>1 &lt; 5</code>)</li>
        <li><b>statement</b> - runs after every pass &nbsp;(<code>i++</code>)</li>
    </ul>
