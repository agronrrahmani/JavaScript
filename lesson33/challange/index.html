<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        input {
            padding: 6px 10px; font-size: 15px;
        }
        button {
            padding: 6px 16px; font-size: 15px;margin-top: 10px;
        }
        #name_error, #age_error {
            visibility:hidden; 
            color: red; 
            margin-left: 8px;
        }
        #phone_error, #age_error {
            visibility:hidden; 
            color: red; 
            margin-left: 8px;
        }
        .hint {
            background: white;border-left: 4px solid #0f3460; padding: 10 px 14px; max-width: 480px;
        }
    </style>
</head>
<body>
    <h1>full validation -name + age</h1>
    <p class="hint">the complete ecample for the lesson not every check needs a regex - <code>city</code>
        if just checked for "not empty"</p>
    <form onsubmit="return validation()">
        <div class="name-contanier">
            <label for="age" id="age_label">Name:</label>
            <input type="text" name="age" id="age">
            <span id="age_error">Please enter a valid age</span>
        </div>
        <br>
        <div class="name-contanier">
            <label for="name" id="name_label">Age:</label>
            <input type="text" name="name" id="name">
            <span id="name_error">Please enter a valid name</span>
        </div>
        <div class="city-contanier">
            <label for="city" id="city_label">City:</label>
            <input type="city" name="city" id="city">
            <span id="city_error">Please enter a valid city</span>
        </div>
        <div class="phone-contanier">
            <label for="phone" id="phone_label">phone:</label>
            <input type="text" name="phone" id="phone">
            <span id="phone_error">Please enter a valid phone number</span>
        </div>
        <button type="submit" name="submit">send</button>
    </form>
</body>
</html>
